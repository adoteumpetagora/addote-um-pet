<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Adote um Pet</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-pata">
                    🐾
                </div>

                <div class="logo-text">

                    <strong>ADOTE</strong>

                    <span>
                        UM PET
                    </span>

                </div>

            </div>


            <!-- TÍTULO -->

            <div class="login-title">

                <h1>
                    Bem-vindo!
                </h1>

                <p>
                    Entre para acessar o painel administrativo.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <p
                    class="mensagem"
                    id="mensagem"
                ></p>


                <button
                    type="submit"
                    class="botao-entrar"
                    id="botaoEntrar"
                >

                    Entrar no painel

                </button>

            </form>


            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o site
            </a>

        </div>

    </main>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>

    <script src="login.js"></script>

</body>

</html>
